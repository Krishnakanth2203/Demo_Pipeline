name: Java Build & Docker Push
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Build JAR with Maven
        run: mvn clean package

      - name: Calculate Version from Git Commits
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "The commit count is: $COMMIT_COUNT"
          echo "APP_VERSION=1.$COMMIT_COUNT" >> $GITHUB_ENV

      - name: Create and Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="v1.${{ github.run_number }}"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            krishnakanth2203/java-demo:${{ env.APP_VERSION }}
            krishnakanth2203/java-demo:latest
